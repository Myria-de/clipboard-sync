[linux]
share = //192.168.178.111/Austausch
remote_dir = Clipboard
username = te
password = ganz_geheim
; Bei Bedarf eine Windows-Domäne/Arbeitsgruppe eintragen.
domain =
; Relative Pfade beziehen sich auf den Ordner dieser config.ini.
; Alternativ z. B. /home/te/Clipboard verwenden.
local_dir = ./Clipboard
smbclient = smbclient
xclip = xclip
wl_paste = wl-paste
timeout = 30

[windows]
share = //192.168.178.111/Austausch
remote_dir = Clipboard
timeout = 30

[receiver]
; Leer: share und remote_dir aus [windows] verwenden.
directory =
poll_interval = 0.5
settle_time = 1.0
; Vorhandene Dateien beim Start nicht in die Zwischenablage übernehmen.
load_existing = no
