[sftp]
# IP-Adresse, Hostname oder Host-Alias aus ~/.ssh/config
host = 192.168.1.50
user = benutzer
# Der Ordner muss auf dem Ziel bereits existieren.
# Relative Pfade beziehen sich auf das SFTP-Startverzeichnis (normalerweise Home).
# Für Home relative Pfade verwenden, kein ~ und keine Umgebungsvariablen.
remote_dir = /home/benutzer/Clipboard
# Optional; ansonsten gelten die Einstellungen aus ~/.ssh/config:
# port = 22
# identity = ~/.ssh/id_ed25519
